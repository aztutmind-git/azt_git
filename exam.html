<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>AztutMind Mock Test</title>


<link rel="stylesheet" href="css/exam.css">


</head>


<body>



<header>

<h2>
AZTUTMIND Mock Exam
</h2>


<div class="timer">

Time Left:
<span id="time">
10:00
</span>

</div>


</header>





<section class="exam-container">



<h2>
Biology Mock Test - Grade 11
</h2>



<form id="quizForm">



<div class="question">


<h3>
1. The basic unit of life is?
</h3>


<label>

<input type="radio"
name="q1"
value="correct">

Cell

</label>



<label>

<input type="radio"
name="q1"
value="wrong">

Tissue

</label>



<label>

<input type="radio"
name="q1"
value="wrong">

Organ

</label>


</div>







<div class="question">


<h3>
2. DNA stands for?
</h3>



<label>

<input type="radio"
name="q2"
value="correct">

Deoxyribonucleic Acid

</label>



<label>

<input type="radio"
name="q2"
value="wrong">

Dynamic Nuclear Acid

</label>



<label>

<input type="radio"
name="q2"
value="wrong">

Digital Network Acid

</label>


</div>







<div class="question">


<h3>
3. Human heart has how many chambers?
</h3>



<label>

<input type="radio"
name="q3"
value="correct">

Four

</label>



<label>

<input type="radio"
name="q3"
value="wrong">

Two

</label>



<label>

<input type="radio"
name="q3"
value="wrong">

Three

</label>


</div>





<button type="button"
onclick="submitExam()">

Submit Exam

</button>




</form>



</section>





<script src="js/exam.js"></script>


</body>

</html>
