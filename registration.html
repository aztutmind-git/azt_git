</head>


<body>



<!-- NAVIGATION -->


<header class="navbar">


<div class="logo">

<span>AZ</span>TUTMIND

<nav>

<!-- REGISTRATION SECTION -->


<section class="registration-section">


<div class="section-title">


<h2>

Student Registration

</h2>


<p>

Join AztutMind Digital Learning Platform

</p>


</div>





<div class="registration-container">



<form action="https://formsubmit.co/sumimega@gmail.com" method="POST">



<h3>
Student Information
</h3>



<label>
Student Name
</label>


<input 
type="text"
name="Student Name"
placeholder="Enter student name"
required>



<label>
Date of Birth
</label>


<input
type="date"
name="DOB"
required>




<label>
Gender
</label>


<select name="Gender">


<option>
Select
</option>


<option>
Male
</option>


<option>
Female
</option>


</select>





<label>
Grade
</label>


<select name="Grade">


<option>
Grade 5
</option>


<option>
Grade 6
</option>


<option>
Grade 7
</option>


<option>
Grade 8
</option>


<option>
Grade 9
</option>


<option>
Grade 10
</option>


<option>
Grade 11
</option>


<option>
Grade 12
</option>


</select>






<h3>
Parent Information
</h3>




<label>
Parent Name
</label>


<input

type="text"

name="Parent Name"

placeholder="Enter parent name"

required>




<label>
Mobile Number
</label>


<input

type="tel"

name="Mobile"

placeholder="Enter mobile number"

required>





<label>
Email Address
</label>


<input

type="email"

name="Email"

placeholder="Enter email"

required>





<h3>
Academic Details
</h3>




<label>
School Name
</label>


<input

type="text"

name="School"

placeholder="School name">






<label>
City
</label>


<input

type="text"

name="City"

placeholder="City">






<label>
Interested Course
</label>


<select name="Course">


<option>
Mathematics
</option>


<option>
Science
</option>


<option>
NEET Preparation
</option>


<option>
JEE Preparation
</option>


<option>
English
</option>


<option>
Coding
</option>


</select>






<label>
Additional Message
</label>


<textarea

name="Message"

rows="5"

placeholder="Any special requirements">

</textarea>






<!-- FORM SETTINGS -->


<input type="hidden"
name="_subject"
value="New AztutMind Student Registration">



<input type="hidden"
name="_captcha"
value="false">



<input type="hidden"
name="_next"
value="thankyou.html">






<button type="submit"
class="primary-btn">


Submit Registration


</button>



</form>



</div>



</section>

<div class="copyright">

</div>


</footer>



</body>

</html>
